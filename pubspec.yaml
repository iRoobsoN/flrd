name: flrd
description: "Flutter Rapid Deployment - The sleek desktop launcher for generating production-ready Flutter MVPs in seconds."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Desktop Window & Experience
  window_manager: ^0.3.9
  file_picker: ^8.0.0

  # Visuals & Micro-interactions
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # Scaffolding & Parsers
  xml: ^6.5.0
  yaml: ^3.1.2
  yaml_edit: ^2.2.1
  path: ^1.9.0
  http: ^1.2.1
  process_run: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/templates/
